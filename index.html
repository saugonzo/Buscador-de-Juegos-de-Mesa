<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buscador de Juegos de Mesa — Limpio</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f2f5; --bg2: #d9e2ec; --text: #263238; --muted:#5c6b73;
      --primary:#2563eb; --primary-700:#1d4ed8; --ok:#16a34a; --warn:#f59e0b;
      --card:#ffffff; --border:#cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0b0f14; --bg2:#0b0f14; --text:#e5e7eb; --muted:#9aa4ad; --primary:#60a5fa; --primary-700:#3b82f6; --card:#0f172a; --border:#223047; }
    }
    * { box-sizing: border-box }
    body {
      font-family: 'Nunito', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; color: var(--text);
      background: linear-gradient(to bottom, var(--bg), var(--bg2));
      min-height: 100svh;
      display: grid; place-items: start center; padding: 24px;
    }
    .app { width: min(980px, 92vw); }
    h1 { margin: 0 0 12px; font-weight: 800; letter-spacing: 0.2px; }
    p.lead { margin: 0 0 16px; color: var(--muted); }
    .row { display: grid; gap: 12px; grid-template-columns: 1fr auto auto; align-items: center; }
    .row > * { height: 44px }
    input[type="text"]{ width: 100%; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); box-shadow: 0 4px 12px rgba(0,0,0,.04); }
    .btn { border: 1px solid transparent; border-radius: 12px; padding: 0 14px; cursor: pointer; font-weight: 700; background: var(--primary); color: #fff; box-shadow: 0 6px 16px rgba(37,99,235,.25); transition: transform .06s ease; }
    .btn:hover { transform: translateY(-1px) }
    .btn.ok { background: var(--ok); box-shadow: 0 6px 16px rgba(22,163,74,.25) }

    .grid { margin-top: 18px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: grid; gap: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.06); }
    .row2 { display:flex; gap:8px; flex-wrap: wrap; align-items:center }
    label.store { display:flex; align-items:center; gap:8px; }
    label.store input { width: auto; height: auto }

    @media (max-width: 640px) {
      /* Input más grande y sin zoom en Android (>=16px) */
      input[type="text"] { height: 56px; font-size: 16px; padding: 12px 16px; }
      .row { grid-template-columns: 1fr; }
      .row > * { width: 100%; height: 52px; }
      .btn { width: 100%; }
    }

    /* Bloque de resultados de pruebas */
    details.testlog { margin-top: 16px; font-size: .9rem }
    details.testlog summary { cursor: pointer }
    .pass { color: #16a34a }
    .fail { color: #dc2626 }
  </style>
</head>
<body>
  <div class="app">
    <h1>Buscador de Juegos de Mesa</h1>
    <p class="lead">Escribe el nombre del juego, elige tiendas y abre las búsquedas en nuevas pestañas. <span class="muted">Enter = abrir seleccionadas · Ctrl+Enter = abrir todas</span></p>

    <div class="row">
      <input id="query" type="text" placeholder="Escribe el nombre del juego…" autofocus />
      <button class="btn ok" id="btn-open-selected" title="Abrir solo seleccionadas">Abrir seleccionadas</button>
      <button class="btn" id="btn-open-all" title="Abrir todas las tiendas">Abrir todas</button>
    </div>

    <div class="grid" id="stores-grid"></div>

    <!-- Pruebas automáticas -->
    <details class="testlog" id="testlog">
      <summary>Ver pruebas</summary>
      <div id="test-results"></div>
    </details>
  </div>

  <script>
    // Lista fija en código (se muestra igual en cualquier dispositivo)
    const DEFAULT_STORES = [
      { id:"elduende",       name:"El Duende",            pattern:"https://www.elduende.com.mx/?s={q}&post_type=product&dgwt_wcas=1", plusSpaces:true },
      { id:"geekystuff",     name:"Geeky Stuff",          pattern:"https://www.geekystuff.mx/search-results-page/?q={q}", plusSpaces:true },
      { id:"eurojuegos",     name:"Eurojuegos",           pattern:"https://www.eurojuegos.com.mx/?s={q}&post_type=product", plusSpaces:true },
      { id:"yegogames",      name:"Yego Games",           pattern:"https://yegogames.com/search?q={q}", plusSpaces:false },
      { id:"tdetlacuache",   name:"T de Tlacuache",       pattern:"https://tdetlacuache.com/search?q={q}", plusSpaces:false },
      { id:"canteraludica",  name:"Cantera Lúdica",       pattern:"https://canteraludica.com/search?q={q}", plusSpaces:false },
      { id:"alfaydelta",     name:"Alfa y Delta",         pattern:"https://www.alfaydelta.com/search?q={q}", plusSpaces:false },
      { id:"infiniteskill",  name:"Infinite Skill",       pattern:"https://www.infiniteskill.com.mx/?s={q}&post_type=product", plusSpaces:true },
      { id:"belugas",        name:"Juego de Belugas",     pattern:"https://juegodebelugas.com/search?q={q}", plusSpaces:false },
      { id:"educadora",      name:"La Casa de la Educadora", pattern:"https://lacasadelaeducadora.com/search?q={q}", plusSpaces:false },
      { id:"juegamas",       name:"Juega Más",            pattern:"https://juegamas.mx/website/search?search={q}&order=name+asc", plusSpaces:false },
      { id:"redqueen",       name:"Red Queen",             pattern:"https://www.redqueen.mx/search?q={q}", plusSpaces:false },
      { id:"amazon",         name:"Amazon México",         pattern:"https://www.amazon.com.mx/s?k={q}", plusSpaces:true },
      { id:"meli",           name:"Mercado Libre",        pattern:"https://listado.mercadolibre.com.mx/{q}", plusSpaces:true },
      { id:"chocita",        name:"Chocita",              pattern:"https://chocitajuegos.com/?s={q}&post_type=product&type_aws=true", plusSpaces:true },
      { id:"quantum",        name:"Quantum Board Games",  pattern:"https://quantumboardgames.com/search?q={q}&options%5Bprefix%5D=last", plusSpaces:true },
      { id:"nalua",          name:"Nalua Juegos",         pattern:"https://naluajuegos.com/index.php?fc=module&module=leoproductsearch&controller=productsearch&txt_not_found=No+se+encontraron+productos&leoproductsearch_static_token=7acaf0b9a17784533afb8ceb574e3993&cate=&search_query={q}", plusSpaces:true },
      { id:"bundaba", name:"Bundaba", pattern:"https://bundaba.com.mx/search?q={q}&type=product", plusSpaces:true },
      { id:"malditosdados", name:"Malditosdados", pattern:"https://malditosdados.com/search?q={q}&options%5Bprefix%5D=last", plusSpaces:true }
    // Agrega aquí más tiendas fijas:
      // { id:"mrboard", name:"Mr. Board Games", pattern:"https://mrboardgames.mx/search?q={q}", plusSpaces:false },
    ];

     // Utilidades
    const grid = document.querySelector('#stores-grid');
    const input = document.querySelector('#query');
    const btnOpenSelected = document.querySelector('#btn-open-selected');
    const btnOpenAll = document.querySelector('#btn-open-all');

    const LS_KEY = 'boardgame-search-v3';

    function buildUrl(store, rawQuery){
      // 1) Codifica todo (incluye tildes/ñ). 2) Si la tienda requiere '+', solo reemplaza los espacios codificados.
      const encoded = encodeURIComponent(rawQuery.trim());
      const q = store.plusSpaces ? encoded.replace(/%20/g, '+') : encoded;
      return store.pattern.replace('{q}', q);
    }

    function renderStores(){
      grid.innerHTML = '';
      DEFAULT_STORES.forEach(s => {
        const urlSample = buildUrl(s, input.value || 'Catan');
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `
          <div class="row2">
            <label class="store"><input type="checkbox" value="${s.id}" checked /> <strong>${s.name}</strong></label>
            <a href="${urlSample}" target="_blank" rel="noopener" title="Probar búsqueda actual">Probar</a>
          </div>
        `;
        grid.appendChild(el);
      });
      restoreSelection();
    }

    function currentLinks(selectedOnly=true){
      const chosen = selectedOnly
        ? new Set([...grid.querySelectorAll('input[type="checkbox"]:checked')].map(c=>c.value))
        : new Set(DEFAULT_STORES.map(s=>s.id));
      const q = input.value.trim();
      if (!q) return [];
      return DEFAULT_STORES.filter(s=>chosen.has(s.id)).map(s=>buildUrl(s, q));
    }

    function openLinks(links){ links.forEach(u => window.open(u, '_blank')); }

    // Persistencia ligera (query + selección)
    function saveState(){
      const state = {
        q: input.value,
        selected: [...grid.querySelectorAll('input[type="checkbox"]:checked')].map(c=>c.value)
      };
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    }
    function loadState(){
      try {
        const s = JSON.parse(localStorage.getItem(LS_KEY)||'null');
        if (!s) return; input.value = s.q || '';
      } catch {}
    }
    function restoreSelection(){
      try {
        const s = JSON.parse(localStorage.getItem(LS_KEY)||'null');
        if (!s?.selected) return;
        new Set(s.selected).forEach(id => {
          const cb = grid.querySelector(`input[value="${id}"]`);
          if (cb) cb.checked = true;
        });
      } catch {}
    }

    // Eventos
    input.addEventListener('input', saveState);
    input.addEventListener('keydown', (e)=>{
      if (e.key === 'Enter' && e.ctrlKey){
        const links = currentLinks(false); if (links.length) openLinks(links);
      } else if (e.key === 'Enter'){
        const links = currentLinks(true); if (links.length) openLinks(links);
      }
    });

    btnOpenSelected.addEventListener('click', ()=>{
      const links = currentLinks(true); if (links.length) openLinks(links);
    });
    btnOpenAll.addEventListener('click', ()=>{
      const links = currentLinks(false); if (links.length) openLinks(links);
    });

    // =====================
    // Pruebas automáticas (básicas)
    // =====================
    function runTests(){
      const out = [];
      const ok = (name, cond) => out.push(`<div class="${cond?'pass':'fail'}">${cond?'✔':'✖'} ${name}</div>`);

      try {
        // 1) buildUrl con plusSpaces=true → espacios como '+' y tildes codificadas
        const stPlus = { pattern:'https://x.com?q={q}', plusSpaces:true };
        ok('plusSpaces=true: espacios con "+" y tildes codificadas',
           /Caf%C3%A9\+con\+leche/.test(buildUrl(stPlus, 'Café con leche')));

        // 2) buildUrl con plusSpaces=false → espacios como %20
        const stEnc = { pattern:'https://x.com?q={q}', plusSpaces:false };
        ok('plusSpaces=false: espacios %20',
           /Caf%C3%A9%20con%20leche/.test(buildUrl(stEnc, 'Café con leche')));

        // 3) Path style (ej. Mercado Libre) debe usar %20
        const stPath = { pattern:'https://listado.mercadolibre.com.mx/{q}', plusSpaces:false };
        ok('Path style usa %20 (no "+")',
           /Caf%C3%A9%20con%20leche/.test(buildUrl(stPath, 'Café con leche')) && !/\+/.test(buildUrl(stPath, 'Café con leche')));

        // 4) currentLinks vacío cuando no hay query
        const qBackup = input.value; input.value = '';
        ok('currentLinks() vacío si no hay búsqueda', currentLinks(true).length === 0);
        input.value = qBackup;

        // 5) No hay saltos de línea sin escapar en joins (regresión de copiar)
        ok('No hay joins con saltos de línea sin escapar', true); // placeholder: ya no usamos join en copiar
      } catch (e) {
        out.push(`<div class="fail">Excepción en pruebas: ${e.message}</div>`);
      }

      const $res = document.querySelector('#test-results');
      if ($res) $res.innerHTML = out.join('');
    }

    // Init
    loadState();
    renderStores();
    runTests();
  </script>
</body>
</html>
